# ─────────────────────────────────────────────────────────────────────────────
# nginx.conf — HTTPS Reverse Proxy for Hospital AI
#
# Place this file at: /etc/nginx/sites-available/hospital-ai
# Then: sudo ln -s /etc/nginx/sites-available/hospital-ai /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx
#
# SSL Certificate (free, auto-renewing):
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d yourhospital.com
#   (Certbot will auto-fill the ssl_certificate paths below)
#
# Replace "yourhospital.com" with your actual domain throughout.
# ─────────────────────────────────────────────────────────────────────────────

# Redirect all plain HTTP → HTTPS
server {
    listen      80;
    listen      [::]:80;
    server_name yourhospital.com www.yourhospital.com;

    # ACME challenge for Let's Encrypt renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS main server ─────────────────────────────────────────────────────────
server {
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name yourhospital.com www.yourhospital.com;

    # ── TLS certificates (filled in by certbot) ──────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/yourhospital.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourhospital.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── TLS hardening ─────────────────────────────────────────────────────────
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       10m;
    ssl_session_tickets       off;
    ssl_stapling              on;
    ssl_stapling_verify       on;
    resolver                  8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout          5s;

    # ── Security headers (Nginx layer, supplementing Express headers) ─────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    nosniff                                        always;
    add_header X-Frame-Options           DENY                                           always;
    add_header X-XSS-Protection          "1; mode=block"                                always;
    add_header Referrer-Policy           strict-origin-when-cross-origin                always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()"     always;

    # ── Rate limiting (Nginx layer — first line of defence) ──────────────────
    # Define zones in the http {} block in nginx.conf:
    #   limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
    #   limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    limit_req       zone=api   burst=10 nodelay;
    limit_req_status 429;

    # ── Gzip for static assets ────────────────────────────────────────────────
    gzip            on;
    gzip_types      text/plain text/css application/javascript application/json;
    gzip_min_length 1000;

    # ── Client body limit (matches Express 16kb limit) ───────────────────────
    client_max_body_size 32k;

    # ── Proxy all requests to Node.js ─────────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # Do not pass internal headers downstream
        proxy_hide_header X-Powered-By;
    }

    # ── Tighter rate limit on login endpoint ──────────────────────────────────
    location /login {
        limit_req       zone=login burst=3 nodelay;
        limit_req_status 429;
        proxy_pass      http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Block hidden files (.env, .git, etc.) ────────────────────────────────
    location ~ /\. {
        deny all;
        return 404;
    }

    # ── Custom error pages ────────────────────────────────────────────────────
    error_page 429 /429.json;
    location = /429.json {
        internal;
        return 429 '{"error":"Too many requests. Please slow down."}';
        add_header Content-Type application/json;
    }

    error_page 502 503 504 /5xx.json;
    location = /5xx.json {
        internal;
        return 503 '{"error":"Service temporarily unavailable."}';
        add_header Content-Type application/json;
    }
}
